name: Build & Release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release for the version in tauri.conf.json
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Publishes a GitHub Release only when the workflow is run manually with
  # "release" enabled. Tag = v<version from tauri.conf.json>.
  meta:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.m.outputs.release }}
      tag: ${{ steps.m.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: m
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          release=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "${{ inputs.release }}" == true ]]; then
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ""
            rust-targets: ""
          - name: Windows
            os: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      # Ad-hoc signature ("-"): no certificate needed. Apple Silicon refuses to
      # open completely unsigned downloaded apps ("is damaged").
      - name: Ad-hoc sign macOS builds
        if: runner.os == 'macOS'
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      - run: npm ci

      - run: npm run check

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      # Manual run: build and attach installers to a published GitHub Release
      # (shown in the repo sidebar). The tag is created if it does not exist.
      - name: Build and publish release
        if: needs.meta.outputs.release == 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages; required because the release config
          # enables createUpdaterArtifacts (also uploads latest.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.meta.outputs.tag }}
          releaseName: AegisGPG ${{ needs.meta.outputs.tag }}
          releaseBody: |
            Unsigned builds: on macOS use right-click → Open, on Windows choose "More info → Run anyway".
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      # Otherwise: build only, upload installers as workflow artifacts.
      - name: Build
        if: needs.meta.outputs.release != 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          args: ${{ matrix.args }}

      - name: Upload installers
        if: needs.meta.outputs.release != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aegisgpg-${{ matrix.os }}-${{ matrix.rust-targets || 'default' }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: warn
