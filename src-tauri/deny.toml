# cargo-deny: advisories, licenses, duplicate crates and sources.
# Run from src-tauri: `cargo deny check`.

[graph]
# Only the platforms we ship.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

[advisories]
# Vulnerabilities and yanked crates fail the check; unmaintained crates are
# reported by the warnings below (Tauri's GTK3 stack has several).
yanked = "deny"
unmaintained = "workspace"
ignore = [
  # No patched `rsa` exists yet (it is pulled in by Sequoia's pure-Rust backend). Affects
  # timing of RSA private-key operations, i.e. RSA keys; Ed25519/Cv25519 (the default) are
  # not affected. Re-check when Sequoia or `rsa` ships a constant-time implementation.
  { id = "RUSTSEC-2023-0071", reason = "no fix available; RSA only, Ed25519 is the default" },
  # `zip` 4.x comes from tauri-plugin-updater, which only unpacks update archives that
  # passed minisign verification and were published by this project. Drop these once
  # the updater moves to zip >= 9.
  { id = "RUSTSEC-2026-0367", reason = "updater only extracts signed archives from our releases" },
  { id = "RUSTSEC-2026-0368", reason = "updater only extracts signed archives from our releases" },
  { id = "RUSTSEC-2026-0369", reason = "updater only extracts signed archives from our releases" },
]

[licenses]
# AegisGPG is GPL-3.0-or-later, so permissive and weak-copyleft licenses are fine.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "GPL-3.0-or-later",
  # Sequoia-PGP (sequoia-openpgp, buffered-reader), linked into a GPL-3 app.
  "LGPL-2.0-or-later",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
